<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Оформление заявки в учебном интернет-магазине.">
  <title>Оформление заявки — Учебный интернет-магазин</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>

      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="order.html">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#advantages">Преимущества</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#popular">Популярные товары</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page__main">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current">Заявка</span>
    </nav>

    <section class="section">
      <h1 class="section__title">Оформление заявки</h1>

      <form class="order-form order-form--page" action="#" method="post">
        <div class="order-form__field">
          <label class="order-form__label" for="page-name">Имя</label>
          <input class="order-form__input" id="page-name" name="name" type="text" minlength="2" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-email">E-mail</label>
          <input class="order-form__input" id="page-email" name="email" type="email" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-phone">Телефон</label>
          <input class="order-form__input" id="page-phone" name="phone" type="tel" placeholder="+7 (900) 000-00-00" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-product">Товар</label>
          <select class="order-form__select" id="page-product" name="product" required>
            <option value="">Выберите товар</option>
            <option value="product-1">Товар 1</option>
            <option value="product-2">Товар 2</option>
            <option value="product-3">Товар 3</option>
          </select>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-comment">Комментарий</label>
          <textarea class="order-form__textarea" id="page-comment" name="comment" rows="4"></textarea>
        </div>

        <div class="order-form__field order-form__field--checkbox">
          <label class="order-form__label" for="page-agreement">
            <input class="order-form__checkbox" id="page-agreement" name="agreement" type="checkbox" required>
            Я согласен на обработку данных
          </label>
        </div>

        <div class="order-form__actions">
          <button class="button button--primary" type="submit">Отправить заявку</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p class="site-footer__text">&copy; 2026 Учебный проект. Все права защищены.</p>
    <p class="site-footer__text">Дисциплина: Фронтенд и бэкенд разработка</p>
  </footer>
</body>
</html>
